name: Android Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"


      - name: Install JS dependencies
        run: npm install
        working-directory: open_guidelines

      - name: Create keystore file from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > open_guidelines/android/keystore.jks

      - name: Create keystore.properties
        run: |
          cat > open_guidelines/android/keystore.properties << EOF
          MYAPP_UPLOAD_FILE=$GITHUB_WORKSPACE/open_guidelines/android/keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x open_guidelines/android/gradlew

      - name: Build release APK
        run: cd open_guidelines/android && ./gradlew app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: open_guidelines/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
