<h1 align="center"> Neonatal rescucitation </h1>
<p>

<a href="../images/neoresusc.png"><img src="../images/neoresusc.png" max-width="100%"/></a>

</p>

If after 20 minutes effective bag and mask ventilation there is no respiratory effort, stop
resuscitation attempts and counsel the family. <br>
<p>

Ref. p 43 WHO Pocket Book of Hospital care for children
</p>
